version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    build: .
    container_name: ollama-chat-backend
    ports:
      - "5000:5000"
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./models.txt:/app/models.txt
      - ./scripts:/app/scripts
    restart: unless-stopped

volumes:
  ollama_data: